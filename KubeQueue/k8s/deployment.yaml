apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubequeue
  labels:
    app: kubequeue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubequeue
  template:
    metadata:
      labels:
        app: kubequeue
    spec:
      containers:
        - name: kubequeue
          image: kubequeue:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kubequeue
spec:
  selector:
    app: kubequeue
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
